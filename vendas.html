<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A5E">
<meta name="robots" content="noindex, nofollow">
<title>Painel do vendedor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F9;--surface:#FFFFFF;--linha:#E4EAF0;
  --ink:#0D1B2A;--ink2:#5F7085;--ink3:#93A2B4;
  --brand:#0B7A5E;--brand-dark:#08604A;--tint:#E8F4F0;
  --alerta:#D8452F;--alerta-tint:#FDEEEC;
  --aviso:#B26A00;--aviso-tint:#FDF2E2;
  --r:14px;--sh1:0 1px 2px rgba(13,27,42,.06);--sh2:0 12px 32px rgba(13,27,42,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;padding-bottom:48px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.cartao{background:var(--surface);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sh1)}
.oculto{display:none!important}

.login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login .cx{width:100%;max-width:380px;padding:30px 26px}
.login h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.login .sub{font-size:13.5px;color:var(--ink2);margin-top:6px}

label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:16px 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--linha);border-radius:11px;
  padding:12px 13px;font-family:"Manrope",sans-serif;font-size:16px;color:var(--ink)}
input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent;background:var(--surface)}
.cta{width:100%;background:var(--brand);color:#fff;border:0;border-radius:11px;padding:14px;cursor:pointer;
  font-family:"Manrope",sans-serif;font-weight:700;font-size:15px;margin-top:20px}
.cta:hover{background:var(--brand-dark)}
.cta:disabled{opacity:.55;cursor:progress}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.erro{background:var(--alerta-tint);color:#A32E1E;border-radius:10px;padding:11px 13px;font-size:13.5px;margin-top:14px;line-height:1.45}

header{position:sticky;top:0;z-index:10;background:rgba(245,247,249,.9);
  backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--linha);padding:13px 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head .t{font-weight:800;font-size:16px;letter-spacing:-.01em;min-width:0}
.head .t small{display:block;font-size:11.5px;font-weight:500;color:var(--ink2);letter-spacing:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acoeshead{display:flex;gap:8px;align-items:center;flex-shrink:0}
.iconbtn{background:var(--surface);border:1px solid var(--linha);border-radius:10px;width:36px;height:36px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;background:var(--tint);color:var(--brand-dark)}
.badge.warn{background:var(--aviso-tint);color:var(--aviso)}
.badge.off{background:var(--bg);color:var(--ink2)}

/* comissão destaque */
.destaque{margin-top:16px;padding:22px 20px;text-align:center;position:relative;overflow:hidden}
.destaque::after{content:"";position:absolute;inset:0 0 auto;height:120px;
  background:radial-gradient(120% 80% at 50% 0,var(--tint) 0,transparent 70%)}
.destaque > *{position:relative;z-index:1}
.destaque .k{font-size:12px;font-weight:600;color:var(--ink2)}
.destaque .v{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(36px,11vw,48px);font-weight:500;line-height:1.08;letter-spacing:-.03em;
  color:var(--brand-dark);margin:6px 0 2px}
.destaque .sub{font-size:12.5px;color:var(--ink2)}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--linha);
  border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;margin-top:12px;box-shadow:var(--sh1)}
.stat{background:var(--surface);padding:14px 12px;text-align:center}
.stat .k{font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:18px;font-weight:500;margin-top:3px;letter-spacing:-.02em}

/* link de divulgação */
.divulga{margin-top:12px;padding:17px 18px}
.divulga .k{font-size:12px;font-weight:600;color:var(--ink2)}
.divulga .url{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--brand-dark);
  background:var(--tint);border-radius:10px;padding:11px 12px;margin-top:9px;word-break:break-all;line-height:1.5}
.dupla{display:flex;gap:9px;margin-top:12px}
.dupla > *{flex:1;margin-top:0}
.btn2{background:var(--bg);color:var(--ink);border:1px solid var(--linha);border-radius:11px;padding:12px;
  cursor:pointer;font-family:"Manrope",sans-serif;font-weight:600;font-size:14px;text-align:center;
  text-decoration:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn2:hover{background:var(--surface)}

/* ganhador */
.ganhei{margin-top:14px;padding:20px;text-align:center;position:relative;overflow:hidden}
.ganhei::after{content:"";position:absolute;inset:0 0 auto;height:110px;
  background:radial-gradient(120% 80% at 50% 0,var(--tint) 0,transparent 70%)}
.ganhei > *{position:relative;z-index:1}
.ganhei .n{font-family:"DM Mono",monospace;font-size:clamp(46px,15vw,62px);font-weight:500;
  line-height:1;color:var(--brand-dark);margin:8px 0 10px}
.ganhei .nome{font-size:15.5px;font-weight:700}
.ganhei .tel{font-family:"DM Mono",monospace;font-size:13.5px;color:var(--ink2);margin-top:2px}

.secao{margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.secao h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.abas{display:flex;gap:7px;margin-top:13px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.abas::-webkit-scrollbar{display:none}
.aba{flex:0 0 auto;background:var(--surface);border:1px solid var(--linha);border-radius:999px;
  padding:8px 14px;cursor:pointer;color:var(--ink2);
  font-family:"Manrope",sans-serif;font-size:13px;font-weight:600}
.aba[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.busca{margin-top:10px;position:relative}
.busca input{padding-left:38px;font-size:15px}
.busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}

.lista{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.venda{padding:15px 16px}
.venda .topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.venda .nome{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.venda .meta{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--ink2);margin-top:2px}
.venda .direita{text-align:right;white-space:nowrap}
.venda .valor{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:500}
.venda .com{font-family:"DM Mono",monospace;font-size:12px;color:var(--brand-dark);margin-top:2px}
.venda .nums{font-family:"DM Mono",monospace;font-size:12.5px;color:var(--brand-dark);
  background:var(--tint);border-radius:9px;padding:8px 10px;margin-top:11px;word-spacing:5px;
  line-height:1.7;word-break:break-all}
.venda .rodape{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.tempo{font-family:"DM Mono",monospace;font-size:12.5px;font-weight:500;color:var(--aviso)}
.tempo.zerado{color:var(--alerta)}
.tempo.ok{color:var(--brand-dark)}
.botoes{display:flex;gap:7px;flex-wrap:wrap}
.mini{border:1px solid var(--linha);background:var(--surface);border-radius:9px;padding:8px 12px;cursor:pointer;
  font-family:"Manrope",sans-serif;font-size:13px;font-weight:600;color:var(--ink2)}
.mini:hover{color:var(--ink)}
.mini.ok{background:var(--brand);border-color:var(--brand);color:#fff}
.mini.ok:hover{background:var(--brand-dark);color:#fff}
.mini.perigo{color:var(--alerta)}
.mini:disabled{opacity:.5;cursor:progress}

.vazio{padding:34px 20px;text-align:center;color:var(--ink2)}
.vazio svg{color:var(--ink3);margin-bottom:9px}
.vazio p{font-size:13.5px;margin-top:5px}

.hist{margin-top:12px;overflow:hidden}
.hlinha{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  padding:13px 16px;border-bottom:1px solid var(--linha)}
.hlinha:last-child{border-bottom:0}
.hnum{font-family:"DM Mono",monospace;font-size:15px;font-weight:500}
.hinfo{font-size:12.5px;color:var(--ink2)}
.hinfo b{color:var(--ink);font-weight:600}
.hcom{font-family:"DM Mono",monospace;font-size:13.5px;font-weight:500;color:var(--brand-dark);white-space:nowrap}

/* ---------- bottom sheet ---------- */
.fundo{position:fixed;inset:0;z-index:40;background:rgba(13,27,42,.5);
  opacity:0;pointer-events:none;transition:opacity .25s}
.fundo.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);
  border-radius:20px 20px 0 0;box-shadow:var(--sh2);
  padding:8px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1)}
.fundo.on .sheet{transform:none}
.sheet .pega{width:38px;height:4px;background:var(--linha);border-radius:999px;margin:0 auto 18px}
.sheet h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sheet .desc{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.55}
.acoes{display:flex;gap:9px;margin-top:22px}
.acoes .cta{flex:1;margin-top:0;padding:15px}
.acoes .btn2{flex:0 0 auto;padding:15px 20px}
.okbox{background:var(--tint);color:var(--brand-dark);border-radius:10px;padding:11px 13px;
  font-size:13.5px;margin-top:14px;line-height:1.45;font-weight:600}

.toast{position:fixed;left:16px;right:16px;bottom:20px;z-index:50;max-width:520px;margin:0 auto;
  background:var(--ink);color:#fff;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:600;
  box-shadow:var(--sh2);transform:translateY(140%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.toast.on{transform:none}
.toast.ruim{background:#A32E1E}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="login" id="telaLogin">
  <div class="cartao cx">
    <h1>Painel do vendedor</h1>
    <p class="sub">Entre com a conta que o organizador cadastrou para você.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" inputmode="email">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <div id="loginErro"></div>
    <button class="cta" id="btnEntrar">Entrar</button>
  </div>
</div>

<div id="telaPainel" class="oculto">
  <header>
    <div class="wrap head">
      <div class="t"><span id="hNome">Vendedor</span><small id="hCiclo">carregando…</small></div>
      <div class="acoeshead">
        <span class="badge off" id="hStatus">—</span>
        <button class="iconbtn" id="btnAtualizar" title="Atualizar" aria-label="Atualizar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
        </button>
        <button class="iconbtn" id="btnSenha" title="Trocar senha" aria-label="Trocar senha">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18v-3a6 6 0 0 1 6-6h1"/><circle cx="16" cy="9" r="5"/><path d="M2 21v-3"/></svg>
        </button>
        <button class="iconbtn" id="btnSair" title="Sair" aria-label="Sair">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="cartao destaque">
      <p class="k">Sua comissão neste ciclo</p>
      <p class="v" id="dComissao">—</p>
      <p class="sub" id="dTaxa">—</p>
    </div>

    <div class="stats">
      <div class="stat"><p class="k">Vendido</p><p class="v" id="sVendido">—</p></div>
      <div class="stat"><p class="k">Bilhetes</p><p class="v" id="sBilhetes">—</p></div>
      <div class="stat"><p class="k">Pendentes</p><p class="v" id="sPendentes">—</p></div>
    </div>

    <div class="cartao divulga">
      <p class="k">Seu link de divulgação</p>
      <p class="url" id="dLink">—</p>
      <div class="dupla">
        <button class="btn2" id="btnCopiar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          Copiar
        </button>
        <a class="btn2" id="btnZap" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Compartilhar
        </a>
      </div>
    </div>

    <div class="cartao ganhei oculto" id="blocoGanhei"></div>

    <div class="secao"><h2>Minhas vendas</h2></div>
    <div class="abas" role="tablist" id="abas"></div>
    <div class="busca">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" placeholder="Buscar por nome ou telefone" autocomplete="off">
    </div>
    <div class="lista" id="lista"></div>

    <div class="secao"><h2>Ciclos anteriores</h2></div>
    <div class="cartao hist" id="hist"></div>
  </div>
</div>

<div class="fundo" id="fundo"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const { SUPABASE_URL, SUPABASE_ANON } = window.RIFA_CONFIG || {};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $  = id => document.getElementById(id);

const app = { resumo:null, vendas:[], filtro:"reservado", busca:"", poll:null, relogio:null };

const brl = c => (Number(c||0)/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad = n => String(n).padStart(3,"0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const tel = t => { const d=String(t||"").replace(/\D/g,"");
  return d.length===11 ? d.replace(/(\d{2})(\d{5})(\d{4})/,"($1) $2-$3")
       : d.length===10 ? d.replace(/(\d{2})(\d{4})(\d{4})/,"($1) $2-$3") : d; };

let toastTimer;
function toast(msg, ruim){
  const t = $("toast");
  t.textContent = msg; t.classList.toggle("ruim", !!ruim); t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3400);
}

// ---------------- sessão ----------------
async function verificarSessao(){
  const { data } = await sb.auth.getSession();
  if(data.session) entrar(); else $("telaLogin").classList.remove("oculto");
}

$("btnEntrar").addEventListener("click", async () => {
  const b = $("btnEntrar"), box = $("loginErro");
  box.innerHTML = ""; b.disabled = true; b.textContent = "Entrando…";
  const { error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim(), password: $("senha").value });
  b.disabled = false; b.textContent = "Entrar";
  if(error){ box.innerHTML = '<p class="erro">E-mail ou senha incorretos.</p>'; return; }
  entrar();
});
$("senha").addEventListener("keydown", e => { if(e.key === "Enter") $("btnEntrar").click(); });

$("btnSair").addEventListener("click", async () => {
  clearInterval(app.poll); clearInterval(app.relogio);
  await sb.auth.signOut(); location.reload();
});

function entrar(){
  $("telaLogin").classList.add("oculto");
  $("telaPainel").classList.remove("oculto");
  montarAbas(); carregar(); carregarHistorico();
  app.poll = setInterval(carregar, 20000);
  app.relogio = setInterval(atualizarTempos, 1000);
}

// ---------------- carga ----------------
$("btnAtualizar").addEventListener("click", () => carregar(true));

const ROTULOS = {
  agendado:["Agendado","off"], aberto:["Vendas abertas",""],
  fechado:["Aguardando sorteio","warn"], sorteado:["Sorteado","warn"],
  pago:["Prêmio pago",""], encerrado:["Encerrado","off"]
};

async function carregar(manual){
  try{
    const { data: r, error } = await sb.rpc("vendedor_resumo");
    if(error) throw error;
    if(!r || !r.ciclo){ toast("Nenhum ciclo cadastrado ainda."); return; }
    app.resumo = r;
    pintarTopo(r);

    const { data: vendas, error: e2 } = await sb.rpc("vendedor_vendas",
      { p_status: app.filtro || null, p_busca: app.busca || null, p_ciclo_id: null });
    if(e2) throw e2;
    app.vendas = vendas || [];
    pintarLista();
    if(manual) toast("Atualizado.");
  }catch(e){
    const m = (e && e.message) || "";
    if(m.includes("Acesso restrito")){
      toast("Sua conta não está vinculada a um vendedor ativo.", true);
      clearInterval(app.poll);
    }else{
      toast("Falha ao carregar. Verifique a conexão.", true);
    }
  }
}

function pintarTopo(r){
  const v = r.vendedor, c = r.ciclo;
  $("hNome").textContent  = v.nome;
  $("hCiclo").textContent = "Ciclo " + c.numero_ciclo + " · código " + v.codigo;
  const [txt, cls] = ROTULOS[c.status] || [c.status,"off"];
  $("hStatus").textContent = txt;
  $("hStatus").className = "badge " + cls;

  $("dComissao").textContent = brl(r.comissao);
  $("dTaxa").textContent = Number(v.comissao_pct) + "% sobre o que você vender · " +
                           brl(r.comissao_total) + " acumulado no total";
  $("sVendido").textContent  = brl(r.vendido);
  $("sBilhetes").textContent = r.bilhetes;
  $("sPendentes").textContent= r.pendentes;

  const base = location.origin + location.pathname.replace(/vendedor\.html$/, "");
  const link = base + "index.html?v=" + encodeURIComponent(v.codigo);
  $("dLink").textContent = link;
  $("btnZap").href = "https://wa.me/?text=" + encodeURIComponent(
    "Rifa de hoje, prêmio de " + brl(c.premio_centavos) + ". Escolha seu número: " + link);
  $("btnCopiar").onclick = async () => {
    try{ await navigator.clipboard.writeText(link); toast("Link copiado."); }
    catch(e){ toast("Copie o link manualmente acima.", true); }
  };

  pintarGanhador(r);
}

function pintarGanhador(r){
  const bloco = $("blocoGanhei"), c = r.ciclo;
  if(c.numero_sorteado === null || c.numero_sorteado === undefined){
    bloco.classList.add("oculto"); return;
  }
  bloco.classList.remove("oculto");

  if(r.ganhador_meu){
    const g = r.ganhador_meu;
    bloco.innerHTML =
      '<p style="font-size:12px;font-weight:600;color:var(--ink2)">Um bilhete seu foi sorteado</p>' +
      '<p class="n">' + pad(c.numero_sorteado) + '</p>' +
      '<p class="nome">' + esc(g.nome) + '</p>' +
      '<p class="tel">' + esc(tel(g.telefone)) + '</p>' +
      '<p style="font-size:13px;color:var(--ink2);margin-top:12px;line-height:1.5">' +
      'O organizador é quem faz o pagamento do prêmio de ' + brl(c.premio_centavos) + '.</p>';
  }else{
    bloco.innerHTML =
      '<p style="font-size:12px;font-weight:600;color:var(--ink2)">Número sorteado do ciclo</p>' +
      '<p class="n" style="color:var(--ink3)">' + pad(c.numero_sorteado) + '</p>' +
      '<p style="font-size:13px;color:var(--ink2);line-height:1.5">' +
      'Nenhum bilhete vendido por você foi sorteado desta vez. Sua comissão sobre as vendas continua valendo.</p>';
  }
}

// ---------------- filtros ----------------
const FILTROS = [["reservado","Aguardando"],["pago","Pagos"],["","Todas"]];

function montarAbas(){
  const el = $("abas"); el.innerHTML = "";
  FILTROS.forEach(([v, nome]) => {
    const b = document.createElement("button");
    b.className = "aba"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", app.filtro === v ? "true" : "false");
    b.textContent = nome;
    b.addEventListener("click", () => { app.filtro = v; montarAbas(); carregar(); });
    el.appendChild(b);
  });
}

let buscaTimer;
$("busca").addEventListener("input", e => {
  clearTimeout(buscaTimer);
  buscaTimer = setTimeout(() => { app.busca = e.target.value.trim(); carregar(); }, 400);
});

// ---------------- lista ----------------
function pintarLista(){
  const el = $("lista");
  if(!app.vendas.length){
    el.innerHTML = '<div class="cartao vazio">' +
      '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h9"/></svg>' +
      '<p>Nenhuma venda com esse filtro.</p></div>';
    return;
  }

  el.innerHTML = app.vendas.map(v => {
    const nums = (v.numeros||[]).map(pad).join(" ");
    const pend = v.status === "reservado";
    return '<div class="cartao venda" data-id="' + v.id + '">' +
      '<div class="topo">' +
        '<div><p class="nome">' + esc(v.comprador_nome) + '</p>' +
        '<p class="meta">' + esc(tel(v.comprador_telefone)) + ' · nº ' + v.id + '</p></div>' +
        '<div class="direita"><p class="valor">' + brl(v.valor_centavos) + '</p>' +
        (v.comissao_centavos ? '<p class="com">+' + brl(v.comissao_centavos) + '</p>' : '') +
        '</div>' +
      '</div>' +
      '<p class="nums">' + nums + '</p>' +
      '<div class="rodape">' +
        '<span class="tempo" data-exp="' + (v.reserva_expira_em || "") + '" data-st="' + v.status + '"></span>' +
        '<div class="botoes">' +
          (pend ? '<button class="mini ok" data-a="confirmar">Confirmar pago</button>' +
                  '<button class="mini" data-a="estender">+15 min</button>' +
                  '<button class="mini perigo" data-a="cancelar">Cancelar</button>' : '') +
        '</div>' +
      '</div></div>';
  }).join("");

  atualizarTempos();
}

function atualizarTempos(){
  document.querySelectorAll(".tempo").forEach(el => {
    const st = el.dataset.st;
    if(st === "pago"){ el.textContent = "Pagamento confirmado"; el.className = "tempo ok"; return; }
    if(st === "expirado"){ el.textContent = "Reserva expirada"; el.className = "tempo zerado"; return; }
    if(st === "cancelado"){ el.textContent = "Cancelada"; el.className = "tempo zerado"; return; }
    const exp = el.dataset.exp;
    if(!exp){ el.textContent = ""; return; }
    const r = new Date(exp).getTime() - Date.now();
    if(r <= 0){ el.textContent = "Expirando…"; el.className = "tempo zerado"; return; }
    const m = Math.floor(r/60000), s = Math.floor(r/1000)%60;
    el.textContent = "Expira em " + m + ":" + String(s).padStart(2,"0");
    el.className = "tempo" + (r < 120000 ? " zerado" : "");
  });
}

$("lista").addEventListener("click", async e => {
  const b = e.target.closest(".mini");
  if(!b) return;
  const id = Number(b.closest(".venda").dataset.id);
  const acao = b.dataset.a;

  if(acao === "cancelar" &&
     !confirm("Cancelar a venda nº " + id + "? Os números voltam para a grade.")) return;

  const rotulo = b.textContent;
  b.disabled = true; b.textContent = "…";

  const chamada =
    acao === "confirmar" ? sb.rpc("confirmar_pagamento", { p_venda_id:id })
  : acao === "estender"  ? sb.rpc("estender_reserva",    { p_venda_id:id, p_minutos:15 })
  :                        sb.rpc("cancelar_venda",      { p_venda_id:id });

  const { error } = await chamada;
  b.disabled = false; b.textContent = rotulo;
  if(error){ toast(error.message, true); return; }

  toast(acao === "confirmar" ? "Pagamento confirmado."
      : acao === "estender"  ? "Reserva estendida em 15 minutos."
      :                        "Venda cancelada. Números liberados.");
  carregar();
});

// ---------------- histórico ----------------
async function carregarHistorico(){
  const { data, error } = await sb.rpc("vendedor_historico", { p_limite: 15 });
  if(error || !data || !data.length){
    $("hist").innerHTML = '<div class="vazio"><p>Você ainda não tem vendas em ciclos encerrados.</p></div>';
    return;
  }
  $("hist").innerHTML = data.map(c =>
    '<div class="hlinha">' +
      '<span class="hnum">' + pad(c.numero_sorteado) + '</span>' +
      '<span class="hinfo">Ciclo ' + c.numero_ciclo + ' · <b>' + c.bilhetes + '</b> bilhetes · ' +
        brl(c.vendido) + (c.ganhou_aqui ? ' · <b>ganhou aqui</b>' : '') + '</span>' +
      '<span class="hcom">' + brl(c.comissao) + '</span>' +
    '</div>').join("");
}

// ---------------- trocar senha ----------------
function abrirSheet(html){ $("sheet").innerHTML = '<div class="pega"></div>' + html; $("fundo").classList.add("on"); }
function fecharSheet(){ $("fundo").classList.remove("on"); }
$("fundo").addEventListener("click", e => { if(e.target === $("fundo")) fecharSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") fecharSheet(); });

$("btnSenha").addEventListener("click", () => {
  abrirSheet(
    '<h2>Trocar senha</h2>' +
    '<p class="desc">A troca vale a partir do próximo acesso. Você continua conectado aqui.</p>' +
    '<label for="pNova">Nova senha</label>' +
    '<input id="pNova" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres">' +
    '<label for="pConf">Repita a nova senha</label>' +
    '<input id="pConf" type="password" autocomplete="new-password">' +
    '<div id="pErro"></div>' +
    '<div class="acoes"><button class="btn2" id="pVoltar">Cancelar</button>' +
    '<button class="cta" id="pSalvar">Salvar senha</button></div>'
  );
  $("pVoltar").addEventListener("click", fecharSheet);
  $("pSalvar").addEventListener("click", trocarSenha);
  $("pConf").addEventListener("keydown", e => { if(e.key === "Enter") trocarSenha(); });
});

async function trocarSenha(){
  const b = $("pSalvar"), box = $("pErro");
  const nova = $("pNova").value, conf = $("pConf").value;
  box.innerHTML = "";

  if(nova.length < 6){
    box.innerHTML = '<p class="erro">A senha precisa ter ao menos 6 caracteres.</p>'; return;
  }
  if(nova !== conf){
    box.innerHTML = '<p class="erro">As duas senhas não são iguais.</p>'; return;
  }

  b.disabled = true; b.textContent = "Salvando…";
  const { error } = await sb.auth.updateUser({ password: nova });
  b.disabled = false; b.textContent = "Salvar senha";

  if(error){
    box.innerHTML = '<p class="erro">' + esc(error.message) + '</p>'; return;
  }
  box.innerHTML = '<p class="okbox">Senha alterada. Use a nova no próximo acesso.</p>';
  $("pNova").value = ""; $("pConf").value = "";
  setTimeout(fecharSheet, 1800);
}

verificarSessao();
